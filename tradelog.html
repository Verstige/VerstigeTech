<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trade Log · VerstigeTech</title>
<link rel="stylesheet" href="assets/styles.css" />
<style>
  .log-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .search-input{
    flex:1;min-width:200px;padding:10px 14px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:var(--font-mono);font-size:13px;
    outline:none;transition:all 0.15s ease;
  }
  .search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,0.1)}
  .filter-chip{
    padding:6px 12px;border-radius:100px;
    background:transparent;border:1px solid var(--border-2);
    color:var(--muted);font-family:var(--font-mono);font-size:11px;
    cursor:pointer;transition:all 0.15s ease;letter-spacing:0.05em;font-weight:600;
  }
  .filter-chip:hover{border-color:var(--cyan);color:var(--cyan)}
  .filter-chip.active{background:var(--panel-2);border-color:var(--border-cyan);color:var(--cyan)}
  .log-stats{display:flex;gap:24px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
  .log-stats strong{color:var(--text);font-weight:600}
  .log-table-wrap{max-height:70vh;overflow:auto;border:1px solid var(--border);border-radius:var(--radius)}
  .log-table{font-family:var(--font-mono);font-size:11px;width:100%;border-collapse:collapse}
  .log-table th{position:sticky;top:0;background:var(--panel-solid);z-index:2;text-align:left;padding:10px 12px;font-size:9px;color:var(--dim);letter-spacing:0.12em;text-transform:uppercase;border-bottom:1px solid var(--border-2);cursor:pointer;user-select:none;white-space:nowrap}
  .log-table th:hover{color:var(--cyan)}
  .log-table th.sorted{color:var(--cyan)}
  .log-table th .arrow{opacity:0.4;margin-left:3px}
  .log-table th.sorted .arrow{opacity:1;color:var(--cyan)}
  .log-table td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
  .log-table tbody tr:hover{background:rgba(255,255,255,0.02)}
</style>
</head>
<body>
<div class="app">
  <section class="page-hero" style="padding:60px 0 30px">
    <div class="container">
      <span class="eyebrow green">TRADE LOG</span>
      <h1>Every trade. <span class="gradient-text">Every detail.</span></h1>
      <p>Search, sort, filter. The complete ledger of closed trades across all 9 engines.</p>
    </div>
  </section>

  <section class="section" style="padding-top:20px">
    <div class="container">

      <!-- Toolbar -->
      <div class="log-toolbar">
        <input id="search" class="search-input" placeholder="Search signal ID, outcome, pips..." />
        <div id="engine-filters" class="flex gap-2"></div>
        <select id="outcome-filter" class="search-input" style="max-width:140px">
          <option value="">All outcomes</option>
          <option value="win">Wins</option>
          <option value="loss">Losses</option>
        </select>
      </div>

      <div class="log-stats" id="log-stats"></div>

      <!-- Table -->
      <div class="log-table-wrap">
        <table class="log-table">
          <thead><tr id="log-thead"></tr></thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>

    </div>
  </section>
</div>

<script src="assets/site.js"></script>
<script>
const ENGINE_PREFIX = {
  NITRO:['VST_','XAU','GOLD'], DRAGON:['GBPJPY'], TITAN:['EURUSD','EUR_'],
  CIPHER:['CIPH_','BTC'], PHANTOM:['PHNTM','SOL'], NEXUS:['NAS','NDX','NEXUS'],
  VOLTALITY:['VS_'], FLUENCE:['US30'],
};
function engineFromSignalId(sid){
  if(!sid) return null;
  const s = String(sid).toUpperCase();
  for(const [eng, prefs] of Object.entries(ENGINE_PREFIX)){
    if(prefs.some(p => s.startsWith(p.toUpperCase()))) return eng;
  }
  return null;
}

let FILTERED = [];
let SORT = {col:'closed_at', dir:-1};

const COLS = [
  {key:'signal_id', label:'Signal ID', sortable:true},
  {key:'engine', label:'Engine', sortable:true},
  {key:'outcome', label:'Outcome', sortable:true},
  {key:'net_pips', label:'Net Pips', sortable:true, num:true},
  {key:'tp_hit', label:'TP', sortable:true, num:true},
  {key:'sl_hit', label:'SL', sortable:true},
  {key:'duration_min', label:'Duration', sortable:true, num:true},
  {key:'closed_at', label:'Closed', sortable:true},
];

function render(){
  if(!DATA) return;

  // Engine filter chips
  const ef = document.getElementById('engine-filters');
  ef.innerHTML = `<div class="filter-chip active" data-engine="">ALL</div>` +
    ENGINES.map(([n])=>`<div class="filter-chip" data-engine="${n}">${n}</div>`).join('');

  // Headers
  document.getElementById('log-thead').innerHTML = COLS.map(c=>
    `<th class="${SORT.col===c.key?'sorted':''}" data-col="${c.key}" style="${c.num?'text-align:right':''}">${c.label}<span class="arrow">${SORT.col===c.key?(SORT.dir>0?'▲':'▼'):'▼'}</span></th>`
  ).join('');

  // Filter
  applyFilters();
}

function applyFilters(){
  const q = document.getElementById('search').value.toLowerCase();
  const activeEng = document.querySelector('#engine-filters .filter-chip.active')?.dataset.engine || '';
  const outcome = document.getElementById('outcome-filter').value;

  let rows = DATA.feed.map(f=>({
    ...f,
    engine: engineFromSignalId(f.signal_id) || 'unknown',
  }));
  if(activeEng) rows = rows.filter(r=>r.engine===activeEng);
  if(outcome) rows = rows.filter(r=>r.outcome===outcome);
  if(q) rows = rows.filter(r=>
    (r.signal_id||'').toLowerCase().includes(q) ||
    (r.outcome||'').toLowerCase().includes(q) ||
    String(r.net_pips).includes(q) ||
    (r.engine||'').toLowerCase().includes(q)
  );

  // Sort
  const col = SORT.col;
  rows.sort((a,b)=>{
    let va = a[col], vb = b[col];
    if(col==='closed_at'){ va = new Date(va||0).getTime(); vb = new Date(vb||0).getTime(); }
    else if(col==='net_pips' || col==='duration_min'){ va = Number(va)||0; vb = Number(vb)||0; }
    else if(col==='engine'){ va = String(va||''); vb = String(vb||''); }
    else { va = String(va||'').toLowerCase(); vb = String(vb||'').toLowerCase(); }
    if(va<vb) return -1*SORT.dir;
    if(va>vb) return 1*SORT.dir;
    return 0;
  });

  FILTERED = rows;
  renderTable();
  renderStats();
}

function renderTable(){
  const tb = document.getElementById('log-tbody');
  if(!FILTERED.length){
    tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--dim);padding:40px">No trades match your filters</td></tr>';
    return;
  }
  tb.innerHTML = FILTERED.map(r=>{
    const eng = ENGINES.find(x=>x[0]===r.engine);
    const color = eng?eng[3]:'#888';
    const outcomeClass = r.outcome==='win'?'win':r.outcome==='loss'?'loss':'neutral';
    return `<tr>
      <td class="muted">${r.signal_id}</td>
      <td><span style="color:${color};font-weight:600">${r.engine}</span></td>
      <td><span class="pill ${outcomeClass}">${(r.outcome||'?').toUpperCase()}</span></td>
      <td class="num ${r.net_pips>0?'positive':'negative'}" style="text-align:right">${fmtPips(r.net_pips)}</td>
      <td class="num muted" style="text-align:right">${r.tp_hit||'—'}</td>
      <td class="num muted" style="text-align:right">${r.sl_hit?'YES':'—'}</td>
      <td class="num muted" style="text-align:right">${r.duration_min?Math.round(r.duration_min)+'m':'—'}</td>
      <td class="muted small">${fmtTime(r.closed_at)}</td>
    </tr>`;
  }).join('');
}

function renderStats(){
  const total = FILTERED.length;
  const wins = FILTERED.filter(r=>r.net_pips>0).length;
  const losses = FILTERED.filter(r=>r.net_pips<=0).length;
  const pips = FILTERED.reduce((s,r)=>s+(r.net_pips||0),0);
  const wr = total>0?(wins/total*100):0;
  document.getElementById('log-stats').innerHTML = `
    <span>Showing <strong>${fmtNum(total)}</strong> trades</span>
    <span><strong style="color:var(--emerald-2)">${wins}</strong> wins · <strong style="color:var(--red-2)">${losses}</strong> losses</span>
    <span>WR <strong>${wr.toFixed(1)}%</strong></span>
    <span>Net <strong style="color:${pips>=0?'var(--emerald-2)':'var(--red-2)'}">${fmtPips(pips)}</strong> pips</span>
  `;
}

document.addEventListener('click', e=>{
  const chip = e.target.closest('.filter-chip');
  if(chip){
    document.querySelectorAll('#engine-filters .filter-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    applyFilters();
  }
  const th = e.target.closest('th[data-col]');
  if(th){
    const col = th.dataset.col;
    if(SORT.col===col) SORT.dir *= -1;
    else { SORT.col = col; SORT.dir = -1; }
    render();
  }
});

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('outcome-filter').addEventListener('change', applyFilters);

window.onDataReady = render;
initPage('tradelog');
</script>

</body>
</html>
